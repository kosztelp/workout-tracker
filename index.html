<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edzéskövető</title>
  
  <!-- Tailwind CSS (via CDN for simplicity) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Vue 3 (via CDN) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e40af">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <style>
    /* Prevent pull-to-refresh on mobile when dragging items */
    body { overscroll-behavior-y: contain; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased">
  <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl overflow-hidden flex flex-col">
    
    <!-- Header -->
    <header class="bg-blue-800 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
      <h1 class="text-xl font-bold">Edzéskövető</h1>
      <div v-if="currentView === 'list'" class="flex space-x-3 text-sm">
        <button @click="exportData" class="bg-blue-700 hover:bg-blue-600 px-2 py-1 rounded" title="Adatok exportálása">Export</button>
        <label class="bg-blue-700 hover:bg-blue-600 px-2 py-1 rounded cursor-pointer" title="Adatok importálása">
          Import
          <input type="file" accept=".json" @change="importData" class="hidden">
        </label>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 relative">
      
      <!-- List View -->
      <div v-if="currentView === 'list'">
        <div v-if="workouts.length === 0" class="text-center text-gray-500 mt-10">
          <p>Még nem rögzítettél edzést.</p>
          <p>Kattints az alábbi gombra az elsőhöz!</p>
        </div>
        
        <div class="space-y-4 pb-20">
          <div v-for="workout in workouts" :key="workout.id" 
               class="bg-white border rounded-xl shadow-sm p-4 relative overflow-hidden">
            <div class="flex justify-between items-start mb-2">
              <h2 class="text-lg font-bold text-gray-800">{{ formatDate(workout.date) }}</h2>
              <div class="flex space-x-2">
                <button @click="editWorkout(workout)" class="text-blue-600 hover:text-blue-800 p-1">
                  ✏️
                </button>
                <button @click="deleteWorkout(workout.id)" class="text-red-500 hover:text-red-700 p-1">
                  🗑️
                </button>
              </div>
            </div>
            
            <div class="flex flex-wrap gap-1 mb-3">
              <span v-for="tag in workout.tags" :key="tag" 
                    class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full font-medium">
                {{ tag }}
              </span>
            </div>
            
            <ul class="text-sm text-gray-600 space-y-1">
              <li v-for="ex in workout.exercises" :key="ex.id" class="truncate">
                • {{ ex.name }} ({{ ex.sets.length }} sorozat)
              </li>
            </ul>
          </div>
        </div>

        <!-- Floating Action Button -->
        <button @click="startNewWorkout" 
                class="absolute bottom-6 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg text-3xl flex items-center justify-center hover:bg-blue-700 transition transform hover:scale-105">
          +
        </button>
      </div>

      <!-- Edit Workout View -->
      <div v-else-if="currentView === 'edit-workout'" class="pb-10">
        
        <!-- Date & Tags -->
        <div class="mb-6 bg-gray-50 p-4 rounded-xl border">
          <label class="block text-sm font-bold text-gray-700 mb-1">Dátum</label>
          <input type="date" v-model="editingWorkout.date" 
                 class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 mb-4 outline-none">
          
          <label class="block text-sm font-bold text-gray-700 mb-1">Címkék (Mit edzettél?)</label>
          <div class="flex flex-wrap gap-2">
            <button v-for="tag in AVAILABLE_TAGS" :key="tag" 
                    @click="toggleTag(tag)"
                    :class="editingWorkout.tags.includes(tag) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300'"
                    class="border px-3 py-1 rounded-full text-sm transition-colors">
              {{ tag }}
            </button>
          </div>
        </div>

        <!-- Exercises -->
        <div class="mb-6">
          <h3 class="text-lg font-bold mb-3 border-b pb-2">Gyakorlatok</h3>
          
          <div v-for="(exercise, index) in editingWorkout.exercises" :key="exercise.id" 
               class="bg-white border rounded-lg p-3 mb-4 shadow-sm relative">
            
            <div class="flex justify-between items-center mb-2">
              <h4 class="font-bold text-blue-900 text-lg">{{ exercise.name }}</h4>
              <button @click="deleteExercise(exercise.id)" class="text-red-500 text-sm">✖ Törlés</button>
            </div>

            <!-- Sets list -->
            <div v-for="(set, sIndex) in exercise.sets" :key="set.id" 
                 class="mb-3 border-l-4 border-blue-500 pl-2">
              
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-gray-500">{{ sIndex + 1 }}. Sorozat</span>
                <button @click="deleteSet(exercise, set.id)" class="text-red-400 text-xs hover:text-red-600">Sorozat törlése</button>
              </div>

              <!-- Parts of the set -->
              <div class="grid grid-cols-12 gap-2 text-xs font-bold text-gray-500 mb-1 px-1">
                <div class="col-span-1 text-center"></div>
                <div class="col-span-4 text-center">Súly (kg)</div>
                <div class="col-span-4 text-center">Ismétlés</div>
                <div class="col-span-3"></div>
              </div>

              <div v-for="(part, pIndex) in set.parts" :key="part.id" 
                   class="grid grid-cols-12 gap-2 mb-1 items-center px-1">
                <div class="col-span-1 text-center font-medium text-gray-400 text-xs">
                  <span v-if="set.parts.length > 1">{{ pIndex + 1 }}.</span>
                </div>
                <div class="col-span-4">
                  <input type="number" v-model="part.weight" placeholder="kg" step="0.5"
                         class="w-full p-2 border rounded text-center focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="col-span-4">
                  <input type="number" v-model="part.reps" placeholder="ism." 
                         class="w-full p-2 border rounded text-center focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="col-span-3 flex justify-end gap-1">
                  <button v-if="set.parts.length > 1" @click="deletePart(set, part.id)" class="text-red-400 hover:text-red-600 p-1" title="Részlet törlése">
                    🗑️
                  </button>
                  <button v-if="pIndex === set.parts.length - 1" @click="addPart(set)" class="text-blue-500 hover:text-blue-700 font-bold p-1 text-lg" title="Kombó / Részlet hozzáadása ehhez a sorozathoz">
                    +
                  </button>
                </div>
              </div>
            </div>
            
            <button @click="addSet(exercise)" 
                    class="w-full mt-2 py-2 bg-blue-50 text-blue-700 font-medium rounded border border-blue-200 hover:bg-blue-100 transition text-sm">
              + Új sorozat hozzáadása
            </button>
          </div>

          <!-- Add Exercise -->
          <div class="mt-4 relative">
            <label class="block text-sm font-bold text-gray-700 mb-1">Új gyakorlat hozzáadása</label>
            <div class="flex">
              <input type="text" v-model="exerciseSearchText" @focus="showAutocomplete = true" 
                     placeholder="Gyakorlat neve..." 
                     class="flex-1 p-2 border rounded-l focus:ring-2 focus:ring-blue-500 outline-none z-20">
              <button @click="addExercise" class="bg-gray-800 text-white px-4 rounded-r font-bold">
                Hozzáad
              </button>
            </div>
            
            <!-- Autocomplete Dropdown -->
            <ul v-if="showAutocomplete && filteredExerciseNames.length > 0" 
                class="absolute z-10 w-full bg-white border border-t-0 rounded-b shadow-lg max-h-40 overflow-y-auto mt-1">
              <li v-for="name in filteredExerciseNames" :key="name" 
                  @click="selectExercise(name)"
                  class="p-2 hover:bg-blue-50 cursor-pointer border-b last:border-b-0">
                {{ name }}
              </li>
            </ul>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex space-x-3 mt-8">
          <button @click="cancelEdit" class="flex-1 py-3 bg-gray-200 text-gray-800 font-bold rounded-lg">
            Mégse
          </button>
          <button @click="saveWorkout" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-lg shadow-md">
            Mentés
          </button>
        </div>

      </div>
    </main>
  </div>

  <script src="app.js"></script>
  
  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('ServiceWorker bejegyezve.', reg);
        }).catch(err => {
          console.log('ServiceWorker hiba:', err);
        });
      });
    }
  </script>
</body>
</html>
